# TBOX PROV Service Configuration
# 此文件可部署为 /etc/tbox/conf.d/prov.yaml 或作为项目级覆盖（./config/prov.yaml）
# 公共配置（common / monitoring）见 common.yaml，此处可按需覆盖公共参数

# 公共配置覆盖示例（按需启用）
common:
  store:
    root: "./data"
  log:
    level: "debug"                       # 默认日志级别（trace/debug/info/warn/error）
    file: "./log/prov.log"

# PROV 服务专属配置
prov:
  ipc:
    socket_path: "/tmp/tbox-prov.sock"

# ECU配置
ecu:
  # ECU UID（仅测试环境使用，生产环境从SE读取）
  uid: "00000000000000000000000000000001"

# 存储配置
storage:
  # 写保护使能
  enable_write_protection: true
  # 最大重试次数
  max_retry_count: 3

# UDS配置
uds:
  # 安全访问配置
  security_access:
    # 支持的安全级别
    supported_levels:
      - 0x27
      - 0x29
    # 种子长度
    seed_length: 4
    # 密钥长度
    key_length: 4

# DID配置
did:
  vin: 0xF190
  vehicle_binding: 0xF191
  provision_state: 0xF192
  vehicle_config: 0xF193
  production_info: 0xF194

# RID配置
rid:
  rewrite_routine: 0xFF00
