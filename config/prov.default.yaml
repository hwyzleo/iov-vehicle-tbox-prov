# TBOX PROV Service Configuration (production default template)
#
# TBOX-PROV-DSN-CR-010 §5: 发布默认模板边界
#   - 由 prov-runtime 安装为 /etc/tbox/conf.d/prov.yaml（文件名无 .default）。
#   - 不含顶层 common:（正式 common 由 BUILD configs/orin/rootfs/etc/tbox/common.yaml
#     唯一提供；PROV 只消费，不安装、不内联副本）。
#   - 不含 Orin 地址、车型、VIN、设备唯一 UID/SN、证书或 Token。
#   - 不含 prov.uid / prov.sn 实例值（测试通过工作目录 ./prov.yaml 显式提供）。
#   - 生产 fail-closed 语义由既有编译门控和业务校验实现，本模板不降低。
#
# BUILD 有 configs/orin/rootfs/etc/tbox/conf.d/prov.yaml 时整文件覆盖本模板
# （CR-010 §6：不执行 YAML 深度合并）。

# PROV 服务专属配置
prov:
  ipc:
    socket_path: "/tmp/tbox-prov.sock"
  log:
    level: "info"

# 存储配置
storage:
  # 写保护使能
  enable_write_protection: true
  # 最大重试次数
  max_retry_count: 3

# UDS/DID/RID 标识（由 DIAG 消费；PROV 经 DIAG 转发，此处仅保留参考）
uds:
  security_access:
    supported_levels:
      - 0x27
      - 0x29
    seed_length: 4
    key_length: 4

did:
  vin: 0xF190
  vehicle_binding: 0xF191
  provision_state: 0xF192
  vehicle_config: 0xF193
  production_info: 0xF194

rid:
  rewrite_routine: 0xFF00
